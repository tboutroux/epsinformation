name: CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  unit-tests-junit-api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epsinformation
          MYSQL_USER: epsinformation
          MYSQL_PASSWORD: epsinformation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Initialize database
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=epsinformation --password=epsinformation epsinformation < bdd/bdd.sql
      - name: Run unit tests
        run: pytest tests/unit_test.py

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests-junit-api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epsinformation
          MYSQL_USER: epsinformation
          MYSQL_PASSWORD: epsinformation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Initialize database
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=epsinformation --password=epsinformation epsinformation < bdd/bdd.sql
      - name: Run integration tests
        run: pytest tests/integration_test.py
  e2e-tests-playwright:
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epsinformation
          MYSQL_USER: epsinformation
          MYSQL_PASSWORD: epsinformation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright
          playwright install --with-deps
      - name: Initialize database
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=epsinformation --password=epsinformation epsinformation < bdd/bdd.sql
      - name: Start Flask server
        run: |
          nohup python app.py --host=0.0.0.0 --port=5000 --no-debug > nohup.out 2>&1 &
      - name: List files after server start
        run: |
          ls -l
      - name: Wait for server to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
          curl -s http://localhost:5000 > /dev/null || (echo "Server did not start" && exit 1)
      - name: Run end-to-end tests
        run: pytest tests/end_to_end_test.py || true
      - name: Show Flask server logs
        run: |
          echo '==== Flask server log (if any) ===='
          cat nohup.out || echo 'No nohup.out log found.'
  performance-tests-jmeter:
    runs-on: ubuntu-latest
    needs: e2e-tests-playwright
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install JMeter
        run: |
          sudo apt-get update
          sudo apt-get install -y jmeter
      - name: Run JMeter performance tests
        run: |
          jmeter -n -t tests/get_posts_test.jmx -l tests/get_posts_test_results.jtl
      - name: Archive JMeter results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: tests/get_posts_test_results.jtl
  owasp-zap-security-scan:
    runs-on: ubuntu-latest
    needs: e2e-tests-playwright
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epsinformation
          MYSQL_USER: epsinformation
          MYSQL_PASSWORD: epsinformation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Initialize database
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=epsinformation --password=epsinformation epsinformation < bdd/bdd.sql
      - name: Start Flask server
        run: |
          nohup python app.py --host=0.0.0.0 --port=5000 --no-debug > nohup.out 2>&1 &
      - name: Wait for server to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
          if ! curl -s http://localhost:5000 > /dev/null; then
            echo "Server did not start"
            echo '==== Flask server log (if any) ===='
            cat nohup.out || echo 'No nohup.out log found.'
            exit 1
          fi      
      - name: Run OWASP ZAP Baseline Scan Manually
        run: |
          echo "Running ZAP scan directly with Docker"
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm --network=host ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:5000
        continue-on-error: true

