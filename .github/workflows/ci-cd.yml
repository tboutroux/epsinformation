name: CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  unit-tests-junit-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: pytest tests/unit_test.py

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests-junit-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run integration tests
        run: pytest tests/integration_test.py

  e2e-tests-playwright:
    runs-on: ubuntu-latest
    needs: unit-tests-junit-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright
          playwright install --with-deps
      - name: Clean database before E2E tests
        run: |
          python tests/clean_db.py
      - name: Start Flask server
        run: |
          nohup python app.py --host=0.0.0.0 --port=5000 --no-debug > nohup.out 2>&1 &
      - name: List files after server start
        run: |
          ls -l
      - name: Wait for server to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
          curl -s http://localhost:5000 > /dev/null || (echo "Server did not start" && exit 1)
      - name: Run end-to-end tests
        run: pytest tests/end_to_end_test.py || true
      - name: Show Flask server logs
        run: |
          echo '==== Flask server log (if any) ===='
          cat nohup.out || echo 'No nohup.out log found.'

  performance-tests-jmeter:
    runs-on: ubuntu-latest
    needs: unit-tests-junit-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install JMeter
        run: |
          sudo apt-get update
          sudo apt-get install -y jmeter
      - name: Run JMeter performance tests
        run: |
          jmeter -n -t tests/get_posts_test.jmx -l tests/get_posts_test_results.jtl
      - name: Archive JMeter results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: tests/get_posts_test_results.jtl

  owasp-zap-security-scan:
    runs-on: ubuntu-latest
    needs: unit-tests-junit-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start Flask server
        run: |
          nohup python app.py --host=0.0.0.0 --port=5000 --no-debug > nohup.out 2>&1 &
      - name: Wait for server to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
          if ! curl -s http://localhost:5000 > /dev/null; then
            echo "Server did not start"
            echo '==== Flask server log (if any) ===='
            cat nohup.out || echo 'No nohup.out log found.'
            exit 1
          fi
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:5000'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-scan-report'
      - name: Cleanup ZAP reports
        run: |
          rm -f report_html.html report_json.json report_md.md
        if: always()

