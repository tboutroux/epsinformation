name: CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: pytest tests/unit_test.py

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run integration tests
        run: pytest tests/integration_test.py

  end-to-end-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright
          playwright install --with-deps
      - name: Start Flask server
        run: |
          nohup python app.py --host=0.0.0.0 --port=5000 --no-debug > nohup.out 2>&1 &
      - name: List files after server start
        run: |
          ls -l
      - name: Wait for server to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done
          curl -s http://localhost:5000 > /dev/null || (echo "Server did not start" && exit 1)
      - name: Run end-to-end tests
        run: pytest tests/end_to_end_test.py || true
      - name: Show Flask server logs
        run: |
          echo '==== Flask server log (if any) ===='
          cat nohup.out || echo 'No nohup.out log found.'


