name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epsinformation
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist playwright
        pip install -r requirements.txt
        
    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium

    - name: Load database schema
      run: |
        mysql -h127.0.0.1 -uroot -proot epsinformation < bdd/bdd.sql
    
    - name: Run unit tests
      run: |
        PYTHONPATH=$PYTHONPATH:$(pwd) pytest tests/unit_test.py -v
        
    # - name: Run integration tests
    #   run: |
    #     PYTHONPATH=$PYTHONPATH:$(pwd) python -m pytest tests/integration_test.py -v
    
    - name: Start Flask server for E2E tests
      run: |
        # Initialiser une configuration minimale requise pour l'application
        mkdir -p conf
        echo '{"secret_key": "test-secret-key", "weather_api": {"base_url": "http://test", "api_key": "test", "insee": "test"}}' > conf/config.json
        
        # Exporter la variable PYTHONPATH correctement
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        
        # Démarrer le serveur Flask en mode debug et attendre qu'il soit prêt
        nohup python -m flask --app app run --host=0.0.0.0 &
        
        # Attendre que le serveur démarre
        echo "Waiting for Flask server to start..."
        sleep 15
        
        # Vérifier que le serveur est bien démarré et échouer si ce n'est pas le cas
        if ! curl -s http://localhost:5000/ > /dev/null; then
          echo "Flask server failed to start properly"
          exit 1
        else
          echo "Flask server started successfully"
        fi
        
    - name: Run end-to-end tests
      run: |
        PYTHONPATH=$PYTHONPATH:$(pwd) python -m pytest tests/end_to_end_test.py -v
        
    - name: Generate test coverage report
      run: |
        PYTHONPATH=$PYTHONPATH:$(pwd) pytest --cov=. --cov-report=xml
        
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false