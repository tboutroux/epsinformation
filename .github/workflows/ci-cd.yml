name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epsinformation
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist playwright
        pip install -r requirements.txt
        
    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium

    - name: Load database schema
      run: |
        mysql -h127.0.0.1 -uroot -proot epsinformation < bdd/bdd.sql
          - name: Run unit tests
      run: |
        PYTHONPATH=$PYTHONPATH:$(pwd) pytest tests/unit_test.py -v
        
    - name: Run integration tests
      run: |
        PYTHONPATH=$PYTHONPATH:$(pwd) python -m pytest tests/integration_test.py -v
          - name: Start Flask server for E2E tests
      run: |
        nohup PYTHONPATH=$PYTHONPATH:$(pwd) python app.py &
        sleep 5
          - name: Run end-to-end tests
      run: |
        PYTHONPATH=$PYTHONPATH:$(pwd) python -m pytest tests/end_to_end_test.py -v
        
    - name: Generate test coverage report
      run: |
        PYTHONPATH=$PYTHONPATH:$(pwd) pytest --cov=. --cov-report=xml
        
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
